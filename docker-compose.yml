version: "3.8"

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: mosaic-oracle-local
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: MosaicLocal123
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  oracle_data: